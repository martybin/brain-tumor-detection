name: swin_unetr
implementation: monai
in_channels: 4
out_channels: 3
feature_size: 24
depths: [2, 2, 2, 2]
num_heads: [3, 6, 12, 24]
use_checkpoint: true
spatial_dims: 3
notes: >
  Swin UNETR baseline via MONAI. feature_size 24 and gradient checkpointing
  target approximately 8 GB VRAM with 64^3 patches and batch size 1.
  Increase feature_size only after measuring memory.
